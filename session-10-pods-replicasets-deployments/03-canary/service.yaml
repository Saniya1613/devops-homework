# Single Service selects BOTH stable and canary pods using the shared label: app=myapp-canary
# kube-proxy balances requests across ALL 5 pods (4 stable + 1 canary).
# Traffic split = pod count ratio: 4:1 = 80% stable / 20% canary
apiVersion: v1
kind: Service
metadata:
  name: myapp-canary-service
  labels:
    app: myapp-canary
spec:
  type: NodePort
  selector:
    # Only the common label — selects BOTH stable and canary pods
    app: myapp-canary
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31030
      protocol: TCP
