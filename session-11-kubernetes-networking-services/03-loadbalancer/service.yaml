apiVersion: v1
kind: Service
metadata:
  name: web-service-loadbalancer
  labels:
    app: web-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: web-loadbalancer
  ports:
    - name: http
      port: 31181      # ServiceLB (klipper) binds this port on the node; 80 is already used by Traefik
      targetPort: 80
      protocol: TCP
