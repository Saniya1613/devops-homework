# Sample application: podinfo (exposes Prometheus /metrics, /healthz and /readyz)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: s20-monitoring
  labels: {app: podinfo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
      annotations:
        prometheus.io/scrape: "true"     # picked up by the 'kubernetes-pods' scrape job
        prometheus.io/port: "9898"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - {name: http, containerPort: 9898}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 9898}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 9898}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: s20-monitoring
spec:
  selector: {app: podinfo}
  ports:
    - {name: http, port: 9898, targetPort: 9898}
---
# Deliberately CPU-hungry pod used to trigger the HighPodCPU alert (limited to 150m so it can't hurt the node)
apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  namespace: s20-monitoring
  labels: {app: cpu-stress}
spec:
  containers:
    - name: stress
      image: busybox:1.36
      command: ["sh", "-c", "while true; do :; done"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 150m, memory: 16Mi}
