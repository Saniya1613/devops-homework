# The database-like backend lives in namespace s14-dns-backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-db }
  template:
    metadata:
      labels: { app: postgres-db }
    spec:
      containers:
        - name: db   # nginx stands in for the DB so we can test with HTTP
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
spec:
  selector: { app: postgres-db }
  ports:
    - port: 5432
      targetPort: 80
