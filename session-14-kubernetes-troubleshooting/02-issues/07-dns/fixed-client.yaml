apiVersion: v1
kind: Pod
metadata:
  name: dns-client
spec:
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["sh", "-c"]
      args:
        - |
          echo "Attempting connection to internal database...";
          # FIX: correct service name + the namespace where it really lives
          curl -s --connect-timeout 3 -o /dev/null -w "HTTP %{http_code} from %{remote_ip}\n" http://postgres-db.s14-dns-backend.svc.cluster.local:5432 || echo "curl failed with exit code $?";
          echo "Process sleeping...";
          sleep 3600
