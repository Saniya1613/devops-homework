apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80     # nginx really listens on 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels: { role: client }
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
