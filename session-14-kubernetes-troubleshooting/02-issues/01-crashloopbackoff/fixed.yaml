# FIX: provide DATABASE_URL and keep the process running (a Pod with restartPolicy
# Always that exits - even with code 0 - would be restarted again and again).
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-pod
  labels:
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: "postgres://notes:Saniya@123@postgres-db:5432/notes"
      command:
        - "python3"
        - "-u"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!")
          while True:
              time.sleep(30)
