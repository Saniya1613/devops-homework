# Load generator from the mini-project README (kubectl run ...) written as a manifest
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: s13-production-webapp
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c", "w() { while true; do wget -q -O- http://web-service >/dev/null; done; }; w & w & w & wait"]
      resources:
        limits: { cpu: 200m, memory: 32Mi }
