# From devops-heros/session-13-storage-hpa-probes/05-probes/readiness.yaml (namespace added, alpine image)
apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
  namespace: s13-probes
  labels:
    app: readiness-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
