# From devops-heros/session-13-storage-hpa-probes/05-probes/liveness.yaml (namespace added, alpine image)
apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
  namespace: s13-probes
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
