# App that needs ~20s to start. The startupProbe gives it up to 10 x 3s = 30s;
# liveness/readiness only begin after the startup probe has succeeded.
apiVersion: v1
kind: Pod
metadata:
  name: startup-slow
  namespace: s13-probes
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'booting... (20s)'; sleep 20; mkdir -p /www; echo ok > /www/index.html; echo 'started'; httpd -f -p 8080 -h /www"]
      startupProbe:
        httpGet: { path: /, port: 8080 }
        periodSeconds: 3
        failureThreshold: 10
      livenessProbe:
        httpGet: { path: /, port: 8080 }
        periodSeconds: 5
      readinessProbe:
        httpGet: { path: /, port: 8080 }
        periodSeconds: 5
      resources:
        limits: { cpu: 20m, memory: 16Mi }
