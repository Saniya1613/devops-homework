{{- if .Values.ingress.enabled }}
{{- $name := include "careslot.name" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{- include "careslot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          # /api -> FastAPI backend, everything else -> React frontend
          - path: /api
            pathType: Prefix
            backend: {service: {name: {{ $name }}-backend, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $name }}-frontend, port: {number: 80}}}
{{- end }}
