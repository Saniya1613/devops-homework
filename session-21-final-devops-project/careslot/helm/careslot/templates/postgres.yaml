apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "careslot.name" . }}-postgres-data
  labels: {{- include "careslot.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep        # patient data survives helm uninstall
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.postgres.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "careslot.name" . }}-postgres
  labels: {{- include "careslot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: {{ include "careslot.name" . }}-postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "careslot.name" . }}-postgres
  labels: {{- include "careslot.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}             # RWO volume - never two postgres pods at once
  selector:
    matchLabels: {app: {{ include "careslot.name" . }}-postgres}
  template:
    metadata:
      labels: {app: {{ include "careslot.name" . }}-postgres, tier: db}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      # uid 70 = postgres user in the alpine image
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: {{ include "careslot.name" . }}-config, key: DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "careslot.name" . }}-db, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "careslot.name" . }}-db, key: DB_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "careslot.name" . }}-postgres-data}
