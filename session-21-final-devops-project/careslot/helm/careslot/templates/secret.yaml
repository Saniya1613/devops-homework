{{- /* Keep an existing password on upgrade; otherwise use the value or generate one. */ -}}
{{- $name := printf "%s-db" (include "careslot.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := .Values.postgres.password -}}
{{- if and (not $password) $existing -}}
{{- $password = index $existing.data "DB_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $password -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "careslot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.postgres.username | quote }}
  DB_PASSWORD: {{ $password | quote }}
