# Default values – tuned for the local single-node k3s cluster
nameOverride: ""

backend:
  image: taskboard-backend          # CI pushes ghcr.io/<owner>/taskboard-backend
  tag: "1.0.1"
  pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 300m, memory: 256Mi}

frontend:
  image: taskboard-frontend
  tag: "1.0.1"
  pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}

imagePullSecrets: []

config:                             # -> ConfigMap (non-secret settings)
  APP_ENV: k3s-local
  LOG_LEVEL: INFO
  DB_PORT: "5432"
  DB_NAME: taskboard

postgres:
  image: postgres:16-alpine
  username: taskboard
  password: Saniya@123              # demo only – override with --set / external secret in real envs
  storage: 1Gi
  storageClass: local-path

ingress:
  enabled: true
  className: traefik
  host: taskboard.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    enabled: true                    # only rendered when the Prometheus Operator CRD exists
