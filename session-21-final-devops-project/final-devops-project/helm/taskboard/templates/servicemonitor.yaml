{{- if and .Values.monitoring.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "taskboard.name" . }}-backend
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: {app: {{ include "taskboard.name" . }}-backend}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
