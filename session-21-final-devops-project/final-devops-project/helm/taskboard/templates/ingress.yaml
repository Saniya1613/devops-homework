{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.name" . }}
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: {{ include "taskboard.name" . }}-backend, port: {number: 8000}}}
          - path: /health
            pathType: Exact
            backend: {service: {name: {{ include "taskboard.name" . }}-backend, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ include "taskboard.name" . }}-frontend, port: {number: 80}}}
{{- end }}
