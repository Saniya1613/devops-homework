apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "taskboard.name" . }}-postgres-data
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.postgres.storageClass }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.name" . }}-postgres
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  selector: {app: {{ include "taskboard.name" . }}-postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.name" . }}-postgres
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}         # RWO volume – never run two postgres pods at once
  selector:
    matchLabels: {app: {{ include "taskboard.name" . }}-postgres}
  template:
    metadata:
      labels: {app: {{ include "taskboard.name" . }}-postgres}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}   # uid 70 = postgres in the alpine image
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: {{ include "taskboard.name" . }}-config, key: DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "taskboard.name" . }}-db, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "taskboard.name" . }}-db, key: DB_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "taskboard.name" . }}-postgres-data}
