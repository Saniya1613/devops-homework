# Plain manifests (rendered from ../helm/taskboard with release name 'taskboard', then cleaned up)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: s21-final
  name: taskboard-postgres-data
  labels:
    app.kubernetes.io/part-of: taskboard
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  namespace: s21-final
  name: taskboard-postgres
  labels:
    app.kubernetes.io/part-of: taskboard
spec:
  selector: {app: taskboard-postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: s21-final
  name: taskboard-postgres
  labels:
    app.kubernetes.io/part-of: taskboard
spec:
  replicas: 1
  strategy: {type: Recreate}         # RWO volume – never run two postgres pods at once
  selector:
    matchLabels: {app: taskboard-postgres}
  template:
    metadata:
      labels: {app: taskboard-postgres}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}   # uid 70 = postgres in the alpine image
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: taskboard-config, key: DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: taskboard-db, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: taskboard-db, key: DB_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: data
          persistentVolumeClaim: {claimName: taskboard-postgres-data}
