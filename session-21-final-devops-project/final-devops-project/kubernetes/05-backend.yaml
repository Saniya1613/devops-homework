# Plain manifests (rendered from ../helm/taskboard with release name 'taskboard', then cleaned up)
apiVersion: v1
kind: Service
metadata:
  namespace: s21-final
  name: taskboard-backend
  labels:
    app.kubernetes.io/part-of: taskboard
    app: taskboard-backend
spec:
  selector: {app: taskboard-backend}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: s21-final
  name: taskboard-backend
  labels:
    app.kubernetes.io/part-of: taskboard
    app: taskboard-backend
spec:
  selector:
    matchLabels: {app: taskboard-backend}
  template:
    metadata:
      labels: {app: taskboard-backend}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: "taskboard-backend:1.0.1"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: taskboard-config}
            - secretRef: {name: taskboard-db}
          readinessProbe:
            httpGet: {path: /ready, port: http}     # checks DB connectivity
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 96Mi
      volumes: [{name: tmp, emptyDir: {}}]
