# Reference copy. GitHub only runs workflows from <repo-root>/.github/workflows/, so to activate it copy this
# file there and keep the `working-directory`/paths below (they are relative to the repo root).
name: TaskBoard CI/CD

on:
  push:
    branches: [main]
    paths: ["session-21-final-devops-project/final-devops-project/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: session-21-final-devops-project/final-devops-project
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-frontend

permissions:
  contents: read

jobs:
  # 1) Build + unit tests
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements.txt"}
      - name: Backend unit tests
        working-directory: ${{ env.PROJECT }}/application/backend
        run: |
          pip install -r requirements.txt
          pytest -q --junitxml=pytest-report.xml
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Frontend build + test
        working-directory: ${{ env.PROJECT }}/application/frontend
        run: npm install --no-audit --no-fund && npm run build && npm test
      - name: Helm lint
        run: helm lint helm/taskboard

  # 2) DevSecOps gates (see security/ and devsecops.yml) – must pass before images are pushed
  security:
    uses: ./.github/workflows/devsecops.yml

  # 3) Docker build, image scan, push to GHCR
  build-scan-push:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    defaults:
      run:
        working-directory: ${{ env.PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -f docker/backend.Dockerfile  -t $BACKEND_IMAGE:${{ github.sha }}  application/backend
          docker build -f docker/frontend.Dockerfile -t $FRONTEND_IMAGE:${{ github.sha }} application/frontend
      - name: Trivy image scan (gate – fail on HIGH/CRITICAL with a fix)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push $BACKEND_IMAGE:${{ github.sha }}
          docker push $FRONTEND_IMAGE:${{ github.sha }}

  # 4) Deploy to Kubernetes with Helm (main branch only, protected 'production' environment = manual approval gate)
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ env.PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        env: {KUBE_CONFIG_DATA: "${{ secrets.KUBE_CONFIG_DATA }}"}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
      - name: Helm upgrade --install
        run: |
          helm upgrade --install taskboard helm/taskboard -n taskboard --create-namespace \
            -f helm/taskboard/values-prod.yaml \
            --set backend.tag=${{ github.sha }} --set frontend.tag=${{ github.sha }} \
            --set postgres.password='${{ secrets.DB_PASSWORD }}' \
            --wait --timeout 5m
      - name: Smoke test
        run: kubectl -n taskboard rollout status deploy/taskboard-backend --timeout=120s
