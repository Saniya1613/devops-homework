# Reference copy (activate by copying to <repo-root>/.github/workflows/). Reusable DevSecOps gate workflow.
name: DevSecOps

on:
  workflow_call:
  pull_request:
    branches: [main]

env:
  PROJECT: session-21-final-devops-project/final-devops-project

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo/${PROJECT} --no-git \
            --config /repo/${PROJECT}/security/gitleaks.toml --redact --exit-code 1

  sast:
    name: SAST (Semgrep + Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install semgrep bandit
      - name: Semgrep (gate on ERROR findings)
        run: semgrep scan --config p/python --config p/dockerfile --severity ERROR --error ${PROJECT}/application ${PROJECT}/docker
      - name: Bandit (gate on HIGH severity)
        run: bandit -r ${PROJECT}/application/backend/app -lll

  sca:
    name: SCA (pip-audit + npm audit + Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit && pip-audit -r ${PROJECT}/application/backend/requirements.txt
      - name: Trivy filesystem (dependencies, gate on CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: ${{ env.PROJECT }}/application
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  iac-scan:
    name: IaC / K8s misconfiguration (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config (Terraform, Kubernetes, Dockerfiles)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: config
          scan-ref: ${{ env.PROJECT }}
          severity: CRITICAL
          exit-code: "1"
