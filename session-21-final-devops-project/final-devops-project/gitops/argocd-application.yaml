# Argo CD Application: deploys the Helm chart in this repo and keeps the cluster in sync with Git.
# kubectl apply -n argocd -f gitops/argocd-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Saniya1613/devops-homework
    targetRevision: main
    path: session-21-final-devops-project/final-devops-project/helm/taskboard
    helm:
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: s21-final
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
