apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: s12-troubleshoot
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop }
  template:
    metadata:
      labels: { app: shop }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-service
  namespace: s12-troubleshoot
spec:
  selector: { app: shop }
  ports:
    - port: 80
      targetPort: 80
