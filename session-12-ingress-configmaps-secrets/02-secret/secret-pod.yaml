# Pod that consumes the Secret as env vars (secretKeyRef) AND as files (secret volume)
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: s12-demo
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"Connecting as $DB_USER to $DB_NAME\"; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_DB
      volumeMounts:
        - name: db-creds
          mountPath: /etc/db-creds
          readOnly: true
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 50m, memory: 32Mi }
  volumes:
    - name: db-creds
      secret:
        secretName: yatri-db-secret
        defaultMode: 0400      # files readable only by the owner
