# Pod that consumes the ConfigMap in BOTH ways:
#   1. envFrom      -> every key becomes an environment variable
#   2. volumeMount  -> every key becomes a file under /etc/yatri
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
  namespace: s12-demo
  labels:
    app: configmap-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"Starting in $ENVIRONMENT mode, log level $LOG_LEVEL\"; sleep 3600"]
      envFrom:
        - configMapRef:
            name: yatri-app-config
      env:
        # single key picked explicitly (and renamed)
        - name: CURRENCY
          valueFrom:
            configMapKeyRef:
              name: yatri-app-config
              key: DEFAULT_CURRENCY
      volumeMounts:
        - name: config-volume
          mountPath: /etc/yatri
          readOnly: true
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 50m, memory: 32Mi }
  volumes:
    - name: config-volume
      configMap:
        name: yatri-app-config
