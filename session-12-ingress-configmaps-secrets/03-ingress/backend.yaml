# Backend – tiny Python HTTP API that reads its config from the ConfigMap and its
# credentials from the Secret, and reports which pod/path served the request.
# Adapted from devops-heros/session-12-ingress-configmaps-secrets/04-full-demo/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  namespace: s12-demo
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command:
            - python3
            - -c
            - |
              import os, socket
              from http.server import HTTPServer, BaseHTTPRequestHandler
              class H(BaseHTTPRequestHandler):
                  def log_message(self, *a): pass
                  def do_GET(self):
                      body = ('Yatri Backend API\n=================\n'
                              f'served-by       : {socket.gethostname()}\n'
                              f'request path    : {self.path}\n'
                              f'host header     : {self.headers.get("Host")}\n'
                              f'ENVIRONMENT     : {os.getenv("ENVIRONMENT")}\n'
                              f'LOG_LEVEL       : {os.getenv("LOG_LEVEL")}\n'
                              f'DEFAULT_CURRENCY: {os.getenv("DEFAULT_CURRENCY")}\n'
                              f'POSTGRES_USER   : {os.getenv("POSTGRES_USER")}\n'
                              f'POSTGRES_DB     : {os.getenv("POSTGRES_DB")}\n'
                              'POSTGRES_PASSWORD: ******** (never print secrets!)\n').encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain; charset=utf-8')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              HTTPServer(('0.0.0.0', 5000), H).serve_forever()
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: yatri-app-config
            - secretRef:
                name: yatri-db-secret
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-service
  namespace: s12-demo
spec:
  type: ClusterIP
  selector:
    app: yatri-backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
