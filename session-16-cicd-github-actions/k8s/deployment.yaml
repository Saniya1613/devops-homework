apiVersion: apps/v1
kind: Deployment
metadata:
  name: session16-app
  namespace: s16-cicd
  labels:
    app: session16-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session16-app
  template:
    metadata:
      labels:
        app: session16-app
    spec:
      containers:
        - name: app
          # CI replaces this tag with the commit SHA image (see workflow "deploy" job)
          image: session16-cicd-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "1.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
